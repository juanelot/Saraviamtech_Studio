<!doctype html>
<!-- PROTOTIPO "Mundo 3D": un solo mundo three.js que la camara recorre, con iconos Phosphor (MIT) extruidos
     y modelos propios. Todo sale de pintar(t): HyperFrames mueve la linea de tiempo de GSAP y cada cuadro
     se dibuja igual siempre. -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="gsap.min.js"></script>
  <script type="importmap">{ "imports": { "three": "./three.module.min.js", "three/addons/": "./addons/" } }</script>
  <style>
    @font-face { font-family: "Inter"; src: url("Inter.ttf"); font-weight: 100 900; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #120c08; }
    body { font-family: "Inter", Arial, sans-serif; }
    #lienzo { position: absolute; inset: 0; }
    #vineta { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 62% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%); }
    #sub { position: absolute; left: 70px; right: 70px; top: 300px; text-align: center; font-size: 66px; line-height: 1.25;
      color: rgba(255,255,255,.66); font-weight: 400; letter-spacing: -0.01em; text-shadow: 0 4px 24px rgba(0,0,0,.7); }
    #sub .p { display: inline-block; margin: 0 0.12em; }
    #sub .k { color: #fff; font-weight: 800; }
    #sub .chip { display: inline-flex; align-items: center; gap: 0.18em; padding: 0.02em 0.22em 0.04em 0.16em; border-radius: 0.2em;
      border: 4px solid #5b8cff; background: rgba(91,140,255,.18); color: #fff; font-weight: 800; }
    #sub .chip svg { width: 0.85em; height: 0.85em; fill: #fff; }
    #pasos { position: absolute; left: 110px; right: 110px; top: 1530px; display: flex; justify-content: space-between; }
    #linea { position: absolute; left: 160px; right: 160px; top: 1572px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.14); }
    #linea i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: #f5a524; }
    .paso { width: 110px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .bola { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; background: #2a211a;
      border: 4px solid rgba(255,255,255,.18); }
    .bola svg { width: 44px; height: 44px; fill: rgba(255,255,255,.55); }
    .paso b { font-size: 28px; font-weight: 600; color: rgba(255,255,255,.5); white-space: nowrap; }
    .paso.si .bola { background: #f5a524; border-color: #f5a524; }
    .paso.si .bola svg { fill: #1a1108; }
    .paso.si b { color: #fff; font-weight: 800; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
    <div class="clip" data-start="0" data-duration="10" data-track-index="0" style="position:absolute;inset:0">
      <canvas id="lienzo" width="1080" height="1920"></canvas>
      <div id="vineta"></div>
      <div id="sub"></div>
      <div id="linea"><i></i></div>
      <div id="pasos"></div>
    </div>
  </div>

  <script>
    window.ICONOS = __ICONOS__;   // SVG de Phosphor (relleno), los pone el script de armado
    window.__timelines = window.__timelines || {};
    const reloj = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to(reloj, { t: 10, duration: 10, ease: "none", onUpdate: () => window.pintar && window.pintar(reloj.t) }, 0);
    window.__timelines["main"] = tl;
  </script>

  <script type="module">
    import * as THREE from "three";
    import { SVGLoader } from "three/addons/SVGLoader.js";

    const W = 1080, H = 1920;
    const FONDO = new THREE.Color("#140d08");
    const GRIS = new THREE.Color("#5d5752");

    // ------------------------------------------------------------------ guion de prueba (tiempos a mano)
    const FRASES = [
      { t: 0.0, fin: 2.5, palabras: ["Tu", "pedido", "sale", "del", { k: "almacén", icono: "storefront" }] },
      { t: 2.6, fin: 4.9, palabras: ["Ella", "lo", { k: "saca" }, "y", "lo", { k: "empaca.", icono: "package" }] },
      { t: 5.0, fin: 7.5, palabras: ["Un", { k: "camión", icono: "truck" }, "lo", "lleva", "a", "tu", "ciudad"] },
      { t: 7.6, fin: 10, palabras: ["y", "llega", "a", "tu", { k: "puerta.", icono: "house" }] },
    ];
    const PASOS = [
      { n: "Pedido", icono: "check", t: 0.4 }, { n: "Empacado", icono: "package", t: 4.2 },
      { n: "En camino", icono: "truck", t: 5.6 }, { n: "Entregado", icono: "house", t: 9.0 },
    ];
    // modelo (hecho en 3D) o icono (Phosphor extruido); en = [x, z]; gris = desde cuando ya se dijo
    const COSAS = {
      caja:   { modelo: "caja", en: [-1.3, 1.0], entra: -1, gris: 5.4 },
      ella:   { icono: "user", color: "#5b8cff", en: [0.3, 1.2], entra: 2.75, gris: 5.4, tam: 1.05 },
      camion: { icono: "truck", color: "#ff7a3d", en: [-0.7, -1.3], entra: 5.25, gris: 99, tam: 1.45 },
      casa:   { icono: "house", color: "#f4efe6", en: [2.0, -2.6], entra: 8.0, gris: 99, tam: 1.3 },
    };
    // planos: que cosas deben verse (la camara calcula la distancia), azimut/elevacion (grados),
    // lejos (1 = justo), lente (fov) y deriva (grados/s mientras dura)
    const PLANOS = [
      { t: 0.0, cosas: ["caja"], az: -32, el: 20, lejos: 1.25, fov: 32, deriva: 3.0 },
      { t: 2.6, cosas: ["caja", "ella"], az: 12, el: 12, lejos: 1.1, fov: 32, deriva: -2.0 },
      { t: 3.65, cosas: ["caja"], az: 28, el: 40, lejos: 0.95, fov: 30, deriva: 3.5 },
      { t: 5.0, cosas: ["camion"], az: -78, el: 22, lejos: 1.15, fov: 32, deriva: 3.0 },
      { t: 7.6, cosas: ["caja", "ella", "camion", "casa"], az: -20, el: 40, lejos: 0.82, fov: 34, deriva: 2.0 },
    ];
    const TRANSICION = 0.9;

    // ------------------------------------------------------------------ mundo
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("lienzo"), antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const escena = new THREE.Scene();
    escena.background = FONDO;
    escena.fog = new THREE.Fog(FONDO, 16, 40);
    const camara = new THREE.PerspectiveCamera(34, W / H, 0.1, 100);

    escena.add(new THREE.HemisphereLight("#fff0dd", "#3a2416", 1.1));
    const sol = new THREE.DirectionalLight("#fff1dc", 3.6);
    const relleno3 = new THREE.DirectionalLight("#cfe0ff", 0.9);   // relleno frio desde delante: que lo azul no se apague
    relleno3.position.set(3, 3, 8); escena.add(relleno3);
    sol.position.set(-4, 9, 6);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    Object.assign(sol.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
    sol.shadow.radius = 6;
    sol.shadow.bias = -0.0004;
    escena.add(sol);
    const contra = new THREE.DirectionalLight("#ff9a3c", 1.8);   // contraluz calido: separa las cosas del fondo
    contra.position.set(5, 4, -7);
    escena.add(contra);

    const piso = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: "#1e140d", roughness: 0.92 }));
    piso.rotation.x = -Math.PI / 2;
    piso.receiveShadow = true;
    escena.add(piso);
    const oro = new THREE.MeshStandardMaterial({ color: "#c8952e", emissive: "#6b4710", emissiveIntensity: 0.6, roughness: 0.4, metalness: 0.6 });
    for (const [x, z, giro] of [[-1, -5, 0.5], [2, -8, -0.35], [-5, 3, -0.6], [4, 4, 0.9]]) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(30, 0.012, 0.035), oro);
      l.position.set(x, 0.006, z); l.rotation.y = giro; escena.add(l);
    }
    // el camino caja -> camion -> casa, que se dibuja por tramos
    const curva = new THREE.CatmullRomCurve3([[-1.3, 1.0], [-0.7, -1.3], [2.0, -2.6]].map(([x, z]) => new THREE.Vector3(x, 0.012, z)));
    const tramos = [];
    for (let i = 3; i < 37; i++) {
      const u = i / 40;
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 0.06), oro);
      m.position.copy(curva.getPoint(u));
      const tg = curva.getTangent(u);
      m.rotation.y = Math.atan2(-tg.z, tg.x);
      escena.add(m); tramos.push(m);
    }

    // ------------------------------------------------------------------ piezas
    function icono3D(nombre, color, tam) {
      const datos = new SVGLoader().parse(window.ICONOS[nombre]);
      const formas = datos.paths.flatMap((p) => SVGLoader.createShapes(p));
      const geo = new THREE.ExtrudeGeometry(formas, { depth: 64, bevelEnabled: true, bevelThickness: 7, bevelSize: 5,
                                                       bevelSegments: 4, curveSegments: 18 });
      geo.scale(1, -1, 1);          // el SVG va con la y hacia abajo
      geo.computeBoundingBox();
      const b = geo.boundingBox;
      geo.translate(-(b.min.x + b.max.x) / 2, -b.min.y, -(b.min.z + b.max.z) / 2);
      geo.computeVertexNormals();
      const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.25,
                                                    emissive: color, emissiveIntensity: 0.12 });
      const malla = new THREE.Mesh(geo, mat);
      malla.scale.setScalar(tam / (b.max.x - b.min.x));
      malla.castShadow = true; malla.receiveShadow = true;
      malla.userData.materiales = [mat];
      return malla;
    }

    // la caja de carton: cuatro solapas que se cierran con cierra(k), k de 0 (abierta) a 1 (cerrada)
    function caja3D() {
      const g = new THREE.Group();
      const carton = new THREE.MeshPhysicalMaterial({ color: "#d39a5e", roughness: 0.75, clearcoat: 0.15 });
      const dentro = new THREE.MeshStandardMaterial({ color: "#7a4e27", roughness: 0.9 });
      const AN = 1.15, AL = 0.8, FO = 0.9, e = 0.04;
      const pieza = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
      for (const [w, h, d, x, z] of [[AN, AL, e, 0, FO / 2], [AN, AL, e, 0, -FO / 2], [e, AL, FO, AN / 2, 0], [e, AL, FO, -AN / 2, 0]]) {
        const m = pieza(w, h, d, carton); m.position.set(x, AL / 2, z); g.add(m);
      }
      const fondo = pieza(AN, e, FO, dentro); fondo.position.y = 0.06; g.add(fondo);
      const solapas = [];
      // delante y detras: bisagra en z = +-FO/2, giran en x (van encima)
      for (const lado of [1, -1]) {
        const piv = new THREE.Group(); piv.position.set(0, AL + e, lado * FO / 2);
        const m = pieza(AN, e, FO / 2, carton); m.position.z = -lado * FO / 4;
        piv.add(m); g.add(piv);
        solapas.push((a) => { piv.rotation.x = lado * a; });
      }
      // izquierda y derecha: bisagra en x = +-AN/2, giran en z (van debajo)
      for (const lado of [1, -1]) {
        const piv = new THREE.Group(); piv.position.set(lado * AN / 2, AL, 0);
        const m = pieza(AN / 2 - 0.02, e, FO - 0.02, carton); m.position.x = -lado * (AN / 4 - 0.01);
        piv.add(m); g.add(piv);
        solapas.push((a) => { piv.rotation.z = -lado * a; });
      }
      const cinta = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.012, FO + 0.04), new THREE.MeshStandardMaterial({ color: "#f0d9a8", roughness: 0.4 }));
      cinta.position.y = AL + 2 * e + 0.004; g.add(cinta);
      g.userData.cierra = (k) => {
        // abiertas hacia fuera (~115 grados); primero se cierran las de los lados, luego las de delante y detras
        solapas.forEach((f, i) => { const kk = i >= 2 ? Math.min(1, k * 1.6) : Math.max(0, k * 1.6 - 0.6); f((1 - kk) * 2.0); });
        cinta.visible = k > 0.97;
      };
      g.userData.cierra(0);
      g.userData.materiales = [carton];
      return g;
    }

    const pedestalGeo = new THREE.CylinderGeometry(0.95, 1.0, 0.1, 64);
    for (const c of Object.values(COSAS)) {
      const grupo = new THREE.Group();
      const ped = new THREE.Mesh(pedestalGeo, new THREE.MeshStandardMaterial({ color: "#3a2a1d", roughness: 0.7 }));
      ped.position.y = 0.05; ped.receiveShadow = true; ped.castShadow = true;
      const obj = c.modelo === "caja" ? caja3D() : icono3D(c.icono, c.color, c.tam);
      obj.position.y = 0.1;
      grupo.add(ped, obj);
      grupo.position.set(c.en[0], 0, c.en[1]);
      escena.add(grupo);
      const mats = obj.userData.materiales;
      Object.assign(c, { grupo, obj, ped, mats, bases: mats.map((m) => m.color.clone()) });
    }

    // ------------------------------------------------------------------ tiempo y camara
    const lim = (x) => Math.min(1, Math.max(0, x));
    const suave = (x) => (x = lim(x), x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const rebote = (x) => { x = lim(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const mezcla = (a, b, k) => a + (b - a) * k;

    // encuadre: la distancia justa para que quepan las cosas del plano (en vertical manda el ancho)
    const RADIO = 0.85;
    function encuadra(p) {
      const pts = p.cosas.map((n) => new THREE.Vector3(COSAS[n].en[0], 0.6, COSAS[n].en[1]));
      const centro = pts.reduce((a, b) => a.add(b), new THREE.Vector3()).multiplyScalar(1 / pts.length);
      const r = Math.max(...pts.map((q) => q.distanceTo(centro))) + RADIO;
      const vfov = (p.fov * Math.PI) / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * (W / H));
      const d = (r / Math.sin(Math.min(hfov, vfov) / 2)) * p.lejos;
      return { ...p, mira: [centro.x, centro.y + r * 0.15, centro.z], d };   // un poco arriba: el subtitulo ocupa lo alto
    }
    const TOMAS = PLANOS.map(encuadra);

    function plano(t) {
      let i = 0;
      while (i + 1 < TOMAS.length && t >= TOMAS[i + 1].t) i++;
      const p = TOMAS[i];
      const q = { ...p, az: p.az + p.deriva * (t - p.t) };
      if (i === 0) return q;
      const a = TOMAS[i - 1];
      const antes = { ...a, az: a.az + a.deriva * (p.t - a.t) };
      const k = suave((t - p.t) / TRANSICION);
      return { mira: antes.mira.map((v, j) => mezcla(v, q.mira[j], k)), az: mezcla(antes.az, q.az, k),
               el: mezcla(antes.el, q.el, k), d: mezcla(antes.d, q.d, k), fov: mezcla(antes.fov, q.fov, k) };
    }

    // ------------------------------------------------------------------ capa 2D
    const sub = document.getElementById("sub");
    const svgDe = (n) => window.ICONOS[n].replace(/<svg[^>]*>/, '<svg viewBox="0 0 256 256">');
    const pasosDiv = document.getElementById("pasos");
    pasosDiv.innerHTML = PASOS.map((p) => `<div class="paso"><div class="bola">${svgDe(p.icono)}</div><b>${p.n}</b></div>`).join("");
    const relleno = document.querySelector("#linea i");

    function pintarTexto(t) {
      const f = FRASES.find((x) => t >= x.t && t < x.fin + 0.001);
      if (!f) { sub.innerHTML = ""; return; }
      const paso = (f.fin - f.t - 0.4) / f.palabras.length;
      sub.innerHTML = f.palabras.map((w, i) => {
        const k = lim((t - (f.t + i * paso)) / 0.16);
        const estilo = `opacity:${k};transform:translateY(${(1 - k) * 18}px) scale(${0.94 + 0.06 * k})`;
        if (typeof w === "string") return `<span class="p" style="${estilo}">${w}</span>`;
        if (w.icono) return `<span class="p chip" style="${estilo}">${svgDe(w.icono)}${w.k}</span>`;
        return `<span class="p k" style="${estilo}">${w.k}</span>`;
      }).join("");
      sub.style.opacity = lim((f.fin - t) / 0.15);
    }
    function pintarPasos(t) {
      let hechos = 0;
      [...pasosDiv.children].forEach((el, i) => {
        const si = t >= PASOS[i].t;
        el.classList.toggle("si", si);
        if (si) hechos = i;
        const k = lim((t - PASOS[i].t) / 0.25);
        el.querySelector(".bola").style.transform = `scale(${si ? 1 + 0.25 * Math.sin(Math.PI * k) : 1})`;
      });
      relleno.style.width = `${(hechos / (PASOS.length - 1)) * 100}%`;
    }

    // ------------------------------------------------------------------ un cuadro
    const tmp = new THREE.Color();
    window.pintar = function (t) {
      const p = plano(t);
      const az = (p.az * Math.PI) / 180, el = (p.el * Math.PI) / 180;
      for (const c of Object.values(COSAS)) {
        const k = lim((t - c.entra) / 0.55);
        c.grupo.visible = t >= c.entra;
        c.grupo.scale.setScalar(Math.max(0.0001, c.entra < 0 ? 1 : rebote(k)));
        c.obj.rotation.y = (1 - suave(k)) * -0.9 + Math.sin(t * 1.3 + c.en[0]) * 0.08;
        c.obj.position.y = 0.1;
        const g = suave((t - c.gris) / 0.6);
        c.mats.forEach((m, j) => m.color.copy(tmp.copy(c.bases[j]).lerp(GRIS, g * 0.8)));
      }
      // la caja: se cierra al "empacarla" y da un saltito
      COSAS.caja.obj.userData.cierra(suave((t - 3.8) / 0.6));
      const e = (t - 4.4) / 0.35;
      if (e > 0 && e < 1) COSAS.caja.obj.position.y = 0.1 + Math.sin(Math.PI * e) * 0.18;
      // el camion: sigue el camino hacia la casa
      const cam = COSAS.camion;
      const r = suave((t - 7.7) / 1.7);
      if (r > 0) {
        const u = mezcla(0.5, 0.86, r), pr = curva.getPoint(u), tg = curva.getTangent(u);
        cam.grupo.position.set(pr.x, 0, pr.z);
        cam.grupo.rotation.y = Math.atan2(-tg.z, tg.x);
        cam.obj.position.y = 0.1 + (r < 1 ? Math.abs(Math.sin(t * 22)) * 0.03 : 0);
      } else {
        cam.grupo.position.set(cam.en[0], 0, cam.en[1]);
        cam.grupo.rotation.y = 0.35;
      }
      cam.ped.visible = r === 0;
      // un icono extruido solo se lee de frente: mira siempre a la camara (con un leve vaiven); los modelos, no
      for (const c of Object.values(COSAS)) {
        if (c.modelo) continue;
        const k = lim((t - c.entra) / 0.55);
        c.obj.rotation.y = az - c.grupo.rotation.y + (1 - suave(k)) * -0.9 + Math.sin(t * 1.3 + c.en[0]) * 0.12;
      }
      tramos.forEach((m, i) => { m.visible = t >= 5.6 + i * 0.05; });

      camara.fov = p.fov;
      camara.position.set(p.mira[0] + p.d * Math.cos(el) * Math.sin(az), p.mira[1] + p.d * Math.sin(el),
                          p.mira[2] + p.d * Math.cos(el) * Math.cos(az));
      camara.lookAt(p.mira[0], p.mira[1], p.mira[2]);
      camara.updateProjectionMatrix();
      renderer.render(escena, camara);
      pintarTexto(t);
      pintarPasos(t);
    };
    window.pintar(0);
  </script>
</body>
</html>
