<!doctype html>
<!-- Cifra que cuenta: de 0 al numero, con prefijo/sufijo y una etiqueta debajo. Plantilla propia del Estudio. -->
<html lang="es" data-composition-variables='[
  {"id":"numero","type":"string","label":"Numero","default":"1000000"},
  {"id":"prefijo","type":"string","label":"Antes","default":""},
  {"id":"sufijo","type":"string","label":"Despues","default":""},
  {"id":"etiqueta","type":"string","label":"Etiqueta","default":"personas"},
  {"id":"color","type":"color","label":"Color","default":"#FFD447"},
  {"id":"posicion","type":"string","label":"Posicion","default":"centro"}
]'>
<head>
  <meta charset="UTF-8" />
  <script src="gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: __ANCHO__px; height: __ALTO__px; overflow: hidden; background: transparent; }
    body { font-family: "Inter", "Montserrat", "Arial Black", Arial, sans-serif; }
    #marco { position: absolute; inset: 0; display: flex; justify-content: center; padding: 0 6%; }
    #tarjeta {
      flex: 0 0 auto; align-self: center; text-align: center; padding: 0.35em 0.7em 0.45em; border-radius: 0.35em;
      background: rgba(8, 10, 20, 0.62); font-size: __TAM__px; line-height: 1;
    }
    #cifra { font-weight: 900; color: #fff; letter-spacing: -0.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #raya { height: 0.07em; margin: 0.18em auto 0.22em; width: 0; border-radius: 1em; }
    #etiqueta { font-size: 0.34em; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACION__" data-width="__ANCHO__" data-height="__ALTO__">
    <div id="marco" class="clip" data-start="0" data-duration="__DURACION__" data-track-index="0">
      <div id="tarjeta">
        <div id="cifra">0</div>
        <div id="raya"></div>
        <div id="etiqueta"></div>
      </div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const D = __DURACION__;
    const destino = Number(String(v.numero).replace(/[^\d.,-]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")) || 0;
    const decimales = (String(v.numero).split(/[.,]/)[1] || "").length > 0 && !/^\d{1,3}([.,]\d{3})+$/.test(String(v.numero)) ? 1 : 0;
    const fmt = new Intl.NumberFormat("es-ES", { maximumFractionDigits: decimales, minimumFractionDigits: decimales });
    const cifra = document.getElementById("cifra");
    const pintar = (x) => { cifra.textContent = `${v.prefijo}${fmt.format(x)}${v.sufijo}`; };
    document.getElementById("etiqueta").textContent = v.etiqueta;
    document.getElementById("raya").style.background = v.color;
    cifra.style.color = "#fff";
    const marco = document.getElementById("marco");
    marco.style.alignItems = v.posicion === "arriba" ? "flex-start" : v.posicion === "abajo" ? "flex-end" : "center";
    marco.style.paddingTop = v.posicion === "arriba" ? "12%" : "0";
    marco.style.paddingBottom = v.posicion === "abajo" ? "22%" : "0";
    document.getElementById("tarjeta").style.alignSelf = marco.style.alignItems;
    // Ancho del numero final (cifras de ancho fijo) para que la tarjeta no crezca mientras cuenta.
    pintar(destino);
    cifra.style.minWidth = cifra.textContent.length + "ch";
    const tarjeta = document.getElementById("tarjeta");
    pintar(0);

    const n = { x: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.from(tarjeta, { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(1.8)" }, 0)
      .to(n, { x: destino, duration: Math.min(1.6, D * 0.5), ease: "power2.out", onUpdate: () => pintar(n.x) }, 0.15)
      .to("#raya", { width: "70%", duration: 0.45, ease: "power3.out" }, 0.35)
      .to("#etiqueta", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.55)
      .fromTo(cifra, { color: "#ffffff" }, { color: v.color, duration: 0.25, yoyo: true, repeat: 1 }, 0.15 + Math.min(1.6, D * 0.5))
      .to(tarjeta, { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
