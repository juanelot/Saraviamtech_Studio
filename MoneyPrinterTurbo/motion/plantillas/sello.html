<!doctype html>
<!-- Sello: una palabra cae como un sello de tinta, ladeada, con un leve desfase de impresion. Plantilla propia del Estudio. -->
<html lang="es" data-composition-variables='[
  {"id":"texto","type":"string","label":"Palabra","default":"Falso"},
  {"id":"detalle","type":"string","label":"Debajo","default":""},
  {"id":"color","type":"color","label":"Color","default":"#E8283C"},
  {"id":"posicion","type":"string","label":"Posicion","default":"centro"}
]'>
<head>
  <meta charset="UTF-8" />
  <script src="gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: __ANCHO__px; height: __ALTO__px; overflow: hidden; background: transparent; }
    body { font-family: "Impact", "Arial Black", "Inter", sans-serif; }
    #marco { position: absolute; inset: 0; display: flex; justify-content: center; padding: 0 6%; }
    #sello { position: relative; font-size: __TAM__px; transform: rotate(-11deg); }
    .capa { padding: 0.12em 0.32em 0.1em; border: 0.09em solid currentColor; border-radius: 0.14em; text-align: center;
            outline: 0.04em solid currentColor; outline-offset: 0.07em; text-transform: uppercase; line-height: 1;
            letter-spacing: 0.04em; white-space: nowrap; }
    .capa small { display: block; font-family: "Inter", Arial, sans-serif; font-weight: 800; font-size: 0.24em;
                  letter-spacing: 0.18em; margin: 0.3em 0 0.25em; }
    #fantasma { position: absolute; inset: 0; color: #fff; mix-blend-mode: screen; opacity: 0.0; }
    #tinta { position: relative; text-shadow: 0 0 0.02em currentColor; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACION__" data-width="__ANCHO__" data-height="__ALTO__">
    <div id="marco" class="clip" data-start="0" data-duration="__DURACION__" data-track-index="0">
      <div id="sello"><div class="capa" id="fantasma"></div><div class="capa" id="tinta"></div></div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const D = __DURACION__;
    const marco = document.getElementById("marco");
    marco.style.alignItems = v.posicion === "arriba" ? "flex-start" : v.posicion === "abajo" ? "flex-end" : "center";
    marco.style.paddingTop = v.posicion === "arriba" ? "16%" : "0";
    marco.style.paddingBottom = v.posicion === "abajo" ? "24%" : "0";
    const contenido = (c) => {
      c.textContent = v.texto;
      if (String(v.detalle).trim()) { const s = document.createElement("small"); s.textContent = v.detalle; c.appendChild(s); }
    };
    contenido(document.getElementById("tinta"));
    contenido(document.getElementById("fantasma"));
    document.getElementById("tinta").style.color = v.color;
    // Que el sello quepa a lo ancho aunque la palabra sea larga.
    const sello = document.getElementById("sello");
    const libre = marco.clientWidth * 0.84;
    if (sello.offsetWidth > libre) sello.style.fontSize = `${__TAM__ * libre / sello.offsetWidth}px`;

    const tl = gsap.timeline({ paused: true });
    // Cae desde grande (en el aire), golpea, rebota un poco y queda.
    tl.fromTo(sello, { scale: 2.6, opacity: 0, rotation: -24 }, { scale: 1, opacity: 1, rotation: -11, duration: 0.22, ease: "power4.in" }, 0.05)
      .to(sello, { scale: 1.05, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1 }, 0.27)
      // Desfase de impresion: un fantasma claro corrido unos px que se recoloca.
      .fromTo("#fantasma", { x: "0.035em", y: "-0.025em", opacity: 0.55 }, { x: 0, y: 0, opacity: 0, duration: 0.35, ease: "power2.out" }, 0.27)
      .to(sello, { opacity: 0, scale: 0.94, duration: 0.25, ease: "power2.in" }, D - 0.25);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
