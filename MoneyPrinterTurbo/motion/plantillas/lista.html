<!doctype html>
<!-- Lista con checks: un punto por renglon; cada casilla se marca con un trazo dibujado. Plantilla propia del Estudio. -->
<html lang="es" data-composition-variables='[
  {"id":"titulo","type":"string","label":"Titulo","default":"Lo que necesitas"},
  {"id":"datos","type":"string","label":"Puntos","default":"Un objetivo claro\nUna hora al día\nPaciencia"},
  {"id":"color","type":"color","label":"Color","default":"#34D27B"},
  {"id":"posicion","type":"string","label":"Posicion","default":"centro"}
]'>
<head>
  <meta charset="UTF-8" />
  <script src="gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: __ANCHO__px; height: __ALTO__px; overflow: hidden; background: transparent; }
    body { font-family: "Inter", "Montserrat", Arial, sans-serif; }
    #marco { position: absolute; inset: 0; display: flex; justify-content: center; padding: 0 7%; }
    #tarjeta { width: 100%; max-width: 20em; font-size: __TAM__px; padding: 0.7em 0.9em 0.8em; border-radius: 0.45em;
               background: rgba(8, 10, 20, 0.7); color: #fff; }
    #titulo { font-weight: 800; font-size: 1.05em; line-height: 1.15; margin-bottom: 0.45em; }
    .punto { display: flex; align-items: center; gap: 0.55em; margin-top: 0.42em; }
    .caja { position: relative; flex: 0 0 auto; width: 1.15em; height: 1.15em; border-radius: 0.28em; border: 0.1em solid rgba(255, 255, 255, 0.8); }
    .relleno { position: absolute; inset: -0.1em; border-radius: 0.28em; transform: scale(0); }
    .caja svg { position: absolute; inset: 0.08em; width: calc(100% - 0.16em); height: calc(100% - 0.16em); overflow: visible; }
    .texto { font-weight: 700; line-height: 1.15; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACION__" data-width="__ANCHO__" data-height="__ALTO__">
    <div id="marco" class="clip" data-start="0" data-duration="__DURACION__" data-track-index="0">
      <div id="tarjeta"><div id="titulo"></div><div id="puntos"></div></div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const D = __DURACION__;
    const marco = document.getElementById("marco");
    marco.style.alignItems = v.posicion === "arriba" ? "flex-start" : v.posicion === "abajo" ? "flex-end" : "center";
    marco.style.paddingTop = v.posicion === "arriba" ? "12%" : "0";
    marco.style.paddingBottom = v.posicion === "abajo" ? "22%" : "0";
    const titulo = document.getElementById("titulo");
    titulo.textContent = v.titulo;
    if (!String(v.titulo).trim()) titulo.style.display = "none";

    const puntos = String(v.datos).split(/\n|\|/).map((l) => l.trim()).filter(Boolean).slice(0, 6).map((l) => {
      const el = document.createElement("div");
      el.className = "punto";
      el.innerHTML = '<div class="caja"><div class="relleno"></div><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="texto"></div>';
      el.querySelector(".texto").textContent = l;
      el.querySelector(".relleno").style.background = v.color;
      document.getElementById("puntos").appendChild(el);
      const trazo = el.querySelector("path");
      const largo = trazo.getTotalLength();
      trazo.style.strokeDasharray = largo;
      trazo.style.strokeDashoffset = largo;
      return { el, trazo, largo };
    });

    const tl = gsap.timeline({ paused: true });
    const tarjeta = document.getElementById("tarjeta");
    tl.from(tarjeta, { y: "0.8em", opacity: 0, duration: 0.4, ease: "power3.out" }, 0)
      .from(titulo, { opacity: 0, y: "0.3em", duration: 0.35, ease: "power2.out" }, 0.15);
    // Todas las filas entran juntas al principio; luego se marcan una a una.
    puntos.forEach((p, k) => tl.from(p.el, { opacity: 0, x: "-0.6em", duration: 0.3, ease: "power2.out" }, 0.25 + k * 0.08));
    const paso = Math.min(0.7, (D * 0.55) / Math.max(1, puntos.length));
    puntos.forEach((p, k) => {
      const t = 0.6 + k * paso;
      tl.to(p.el.querySelector(".relleno"), { scale: 1, duration: 0.22, ease: "back.out(2.5)" }, t)
        .to(p.el.querySelector(".caja"), { borderColor: v.color, duration: 0.1 }, t)
        .to(p.trazo, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, t + 0.08)
        .fromTo(p.el.querySelector(".texto"), { scale: 1 }, { scale: 1.06, duration: 0.14, yoyo: true, repeat: 1, ease: "power1.inOut", transformOrigin: "left center" }, t + 0.05);
    });
    tl.to(tarjeta, { opacity: 0, y: "-0.4em", duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
