<!doctype html>
<!-- Rotulo inferior (lower third): titulo y subtitulo con una barra de color. Plantilla propia del Estudio. -->
<html lang="es" data-composition-variables='[
  {"id":"titulo","type":"string","label":"Titulo","default":"Ana Garcia"},
  {"id":"subtitulo","type":"string","label":"Subtitulo","default":"Economista"},
  {"id":"color","type":"color","label":"Color","default":"#FFD447"},
  {"id":"posicion","type":"string","label":"Posicion","default":"abajo"}
]'>
<head>
  <meta charset="UTF-8" />
  <script src="gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: __ANCHO__px; height: __ALTO__px; overflow: hidden; background: transparent; }
    body { font-family: "Inter", "Montserrat", Arial, sans-serif; }
    #marco { position: absolute; left: 6%; right: 6%; font-size: __TAM__px; display: flex; align-items: stretch; }
    #barra { width: 0.14em; border-radius: 0.1em; transform-origin: bottom; flex: 0 0 auto; }
    #caja { overflow: hidden; margin-left: 0.25em; }
    #panel { background: rgba(8, 10, 20, 0.72); padding: 0.28em 0.6em 0.34em; border-radius: 0 0.2em 0.2em 0; }
    #titulo { font-weight: 800; color: #fff; line-height: 1.1; white-space: nowrap; }
    #subtitulo { font-weight: 600; font-size: 0.52em; color: rgba(255, 255, 255, 0.85); margin-top: 0.25em; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACION__" data-width="__ANCHO__" data-height="__ALTO__">
    <div id="marco" class="clip" data-start="0" data-duration="__DURACION__" data-track-index="0">
      <div id="barra"></div>
      <div id="caja">
        <div id="panel">
          <div id="titulo"></div>
          <div id="subtitulo"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const D = __DURACION__;
    document.getElementById("titulo").textContent = v.titulo;
    const sub = document.getElementById("subtitulo");
    sub.textContent = v.subtitulo;
    if (!String(v.subtitulo).trim()) sub.style.display = "none";
    document.getElementById("barra").style.background = v.color;
    const marco = document.getElementById("marco");
    if (v.posicion === "arriba") marco.style.top = "9%"; else marco.style.bottom = __ALTO__ > __ANCHO__ ? "24%" : "12%";

    const tl = gsap.timeline({ paused: true });
    tl.from("#barra", { scaleY: 0, duration: 0.3, ease: "power3.out" }, 0)
      .from("#panel", { xPercent: -105, duration: 0.5, ease: "power3.out" }, 0.12)
      .from("#titulo", { y: "0.6em", opacity: 0, duration: 0.4, ease: "power2.out" }, 0.3)
      .from("#subtitulo", { y: "0.5em", opacity: 0, duration: 0.4, ease: "power2.out" }, 0.42)
      .to("#panel", { xPercent: -105, duration: 0.35, ease: "power2.in" }, D - 0.45)
      .to("#barra", { scaleY: 0, duration: 0.25, ease: "power2.in" }, D - 0.25);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
