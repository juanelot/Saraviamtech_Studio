<!doctype html>
<!-- Porcentaje: un anillo se llena hasta el % mientras el numero cuenta en el centro. Plantilla propia del Estudio. -->
<html lang="es" data-composition-variables='[
  {"id":"porcentaje","type":"string","label":"Porcentaje","default":"73"},
  {"id":"etiqueta","type":"string","label":"Etiqueta","default":"de los jóvenes no ahorra"},
  {"id":"color","type":"color","label":"Color","default":"#3DD6F5"},
  {"id":"posicion","type":"string","label":"Posicion","default":"centro"}
]'>
<head>
  <meta charset="UTF-8" />
  <script src="gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: __ANCHO__px; height: __ALTO__px; overflow: hidden; background: transparent; }
    body { font-family: "Inter", "Montserrat", "Arial Black", Arial, sans-serif; }
    #marco { position: absolute; inset: 0; display: flex; justify-content: center; padding: 0 7%; }
    #tarjeta { display: flex; flex-direction: column; align-items: center; font-size: __TAM__px; padding: 0.6em 0.8em 0.7em;
               border-radius: 0.45em; background: rgba(8, 10, 20, 0.7); color: #fff; max-width: 14em; }
    #anillo { position: relative; width: 5.6em; height: 5.6em; }
    #anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    #num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900;
           font-size: 1.55em; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    #num small { font-size: 0.5em; margin-left: 0.05em; margin-top: -0.6em; }
    #etiqueta { margin-top: 0.4em; font-weight: 700; font-size: 0.62em; line-height: 1.2; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="__DURACION__" data-width="__ANCHO__" data-height="__ALTO__">
    <div id="marco" class="clip" data-start="0" data-duration="__DURACION__" data-track-index="0">
      <div id="tarjeta">
        <div id="anillo">
          <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="9"/>
            <circle id="arco" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round"/></svg>
          <div id="num"><span>0</span><small>%</small></div>
        </div>
        <div id="etiqueta"></div>
      </div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes.getVariables();
    const D = __DURACION__;
    const marco = document.getElementById("marco");
    marco.style.alignItems = v.posicion === "arriba" ? "flex-start" : v.posicion === "abajo" ? "flex-end" : "center";
    marco.style.paddingTop = v.posicion === "arriba" ? "12%" : "0";
    marco.style.paddingBottom = v.posicion === "abajo" ? "22%" : "0";
    const pct = Math.max(0, Math.min(100, Number(String(v.porcentaje).replace(",", ".").replace(/[^\d.]/g, "")) || 0));
    const dec = /[.,]\d/.test(String(v.porcentaje)) ? 1 : 0;
    const etq = document.getElementById("etiqueta");
    etq.textContent = v.etiqueta;
    if (!String(v.etiqueta).trim()) etq.style.display = "none";
    const arco = document.getElementById("arco");
    const C = 2 * Math.PI * 42;
    arco.style.stroke = v.color;
    arco.style.strokeDasharray = C;
    arco.style.strokeDashoffset = C;
    const num = document.querySelector("#num span");
    const fmt = new Intl.NumberFormat("es-ES", { minimumFractionDigits: dec, maximumFractionDigits: dec });

    const n = { x: 0 };
    const llena = Math.min(1.6, D * 0.45);
    const tl = gsap.timeline({ paused: true });
    const tarjeta = document.getElementById("tarjeta");
    tl.from(tarjeta, { scale: 0.7, opacity: 0, duration: 0.4, ease: "back.out(1.7)" }, 0)
      .to(arco, { strokeDashoffset: C * (1 - pct / 100), duration: llena, ease: "power2.inOut" }, 0.25)
      .to(n, { x: pct, duration: llena, ease: "power2.inOut", onUpdate: () => { num.textContent = fmt.format(n.x); } }, 0.25)
      .from(etq, { opacity: 0, y: "0.4em", duration: 0.35, ease: "power2.out" }, 0.45)
      .to("#num", { scale: 1.12, color: v.color, duration: 0.16, yoyo: true, repeat: 1, ease: "power1.inOut" }, 0.25 + llena)
      .to(tarjeta, { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" }, D - 0.3);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
